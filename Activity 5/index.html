
<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Log In</title>
     <style>
          * {
               box-sizing: border-box;
          }

          body {
               min-height: 100vh;
               margin: 0;
               display: grid;
               place-items: center;
               padding: 24px;
               background: #1976d2;
               color: #172b4d;
               font-family: Arial, sans-serif;
          }

          .login-box {
               width: min(100%, 390px);
               padding: 36px;
               border-radius: 10px;
               background: #fff;
               box-shadow: 0 16px 40px rgba(10, 45, 90, 0.22);
          }

          h1 {
               margin: 0 0 8px;
               color: #123b67;
               font-size: 28px;
          }

          .intro {
               margin: 0 0 28px;
               color: #62738a;
               font-size: 15px;
          }

          .field {
               margin-bottom: 18px;
          }

          label {
               display: block;
               margin-bottom: 7px;
               font-size: 14px;
               font-weight: 700;
          }

          input[type="email"],
          input[type="password"] {
               width: 100%;
               min-height: 46px;
               padding: 11px 12px;
               border: 1px solid #c9d4e0;
               border-radius: 5px;
               background: #fff;
               color: #172b4d;
               font: inherit;
          }

          input:focus {
               border-color: #1976d2;
               outline: 3px solid rgba(25, 118, 210, 0.16);
          }

          .options {
               display: flex;
               align-items: center;
               margin: 2px 0 22px;
               color: #46566b;
               font-size: 14px;
          }

          .options label {
               display: flex;
               align-items: center;
               gap: 8px;
               margin: 0;
               font-weight: 400;
               cursor: pointer;
          }

          .options input {
               width: 16px;
               height: 16px;
               margin: 0;
               accent-color: #1976d2;
          }

          button {
               width: 100%;
               min-height: 46px;
               border: 0;
               border-radius: 5px;
               background: #1976d2;
               color: #fff;
               font: inherit;
               font-weight: 700;
               cursor: pointer;
          }

          button:hover {
               background: #125eaa;
          }

          button:focus-visible {
               outline: 3px solid #7db9f2;
               outline-offset: 3px;
          }

          .message {
               min-height: 20px;
               margin: 14px 0 0;
               color: #17633a;
               font-size: 14px;
               text-align: center;
          }

          @media (max-width: 420px) {
               .login-box {
                    padding: 28px 22px;
               }
          }
     </style>
</head>
<body>
     <main class="login-box">
          <h1>Welcome back</h1>
          <p class="intro">Log in to continue.</p>

          <form id="login-form">
               <div class="field">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
               </div>

               <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
               </div>

               <div class="options">
                    <label for="remember">
                         <input id="remember" name="remember" type="checkbox">
                         Remember me
                    </label>
               </div>

               <button type="submit">Log in</button>
               <p class="message" id="form-message" role="status" aria-live="polite"></p>
          </form>
     </main>

     <script>
          const loginForm = document.getElementById("login-form");
          const formMessage = document.getElementById("form-message");

          loginForm.addEventListener("submit", (event) => {
               event.preventDefault();
               formMessage.textContent = "Your login form is ready to connect to an account system.";
          });
     </script>
</body>
</html>
